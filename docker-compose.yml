services:
  mysql:
    image: mysql:8.0
    container_name: a3-mobilidade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts montados só para consulta/cópia — NÃO como initdb.d
      # (evita rodar 01–08 e script_completo em duplicidade).
      - ./sql:/sql:ro
      - ./scripts:/scripts:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog-format=ROW
      - --event-scheduler=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
